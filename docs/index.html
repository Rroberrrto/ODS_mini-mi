<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mundo Curioso: tres mini-juegos para niños de 4 a 6 años.">
  <title>Mundo Curioso</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Barra fija: siempre visible, sin importar la pantalla. -->
  <header class="barra">
    <a class="boton-icono" id="boton-inicio" href="#bienvenida" aria-label="Volver al inicio">
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
        <path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="currentColor"/>
      </svg>
    </a>
    <span class="barra-titulo">Mundo Curioso</span>
    <button class="boton-icono" id="boton-sonido" type="button" aria-pressed="true" aria-label="Sonido activado">
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
        <path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/>
        <path class="ondas" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path class="tache" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <!-- Aquí dibuja cada pantalla. El enrutador (js/app.js) decide cuál según el hash de la URL. -->
  <main id="app" tabindex="-1"></main>

  <noscript><p class="aviso">Este juego necesita JavaScript para funcionar.</p></noscript>

  <!--
    Scripts clásicos (sin type="module") a propósito: los módulos no cargan
    al abrir el archivo con doble clic (file://). El orden importa:
    app.js primero porque define el objeto MundoCurioso que usan los demás.
  -->
  <script src="js/app.js"></script>
  <script src="js/v1-bienvenida.js"></script>
  <script src="js/v2-hojas.js"></script>
  <script src="js/v3-casa.js"></script>
  <script src="js/v4-palabras.js"></script>
  <script src="js/v5-progreso.js"></script>
</body>
</html>
